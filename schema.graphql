enum Protocol {
  UNISWAP_V4
  PANCAKE_INFINITY
}

enum CTOStatus {
  PENDING
  APPROVED
  REJECTED
}

enum CTOSource {
  LOCKER_GO
  HOOK_V4_GO
  HOOK_INFINITY_GO
  LOCKER_V1
}

enum SwapSide {
  BUY # quote currency in, token out
  SELL # token in, quote currency out
}

"""
Global, singleton counters across the whole deployment. id is always "1".
"""
type SparkStats @entity(immutable: false) {
  id: ID!
  tokensLaunched: BigInt! # SparkLauncher (V1) + SparkGo, combined
  dexCount: BigInt!
  lockerFeeClaims: BigInt!
  hookFeeClaims: BigInt!
  burns: BigInt!
  totalNativeBurnedIn: BigInt! # native-BNB-quoted SparkGo burns only — see note below
  totalCallerRewardsPaid: BigInt! # native-BNB-quoted SparkGo burns only — see note below
  totalTokensBurned: BigInt!
  ctoApplications: BigInt!
  ctoApprovals: BigInt!
  ctoRejections: BigInt!
  totalSwaps: BigInt! # includes both SparkLauncher (SwapV1) and SparkGo (SwapGo) swaps
  totalBuys: BigInt!
  totalSells: BigInt!
  totalVolumeNative: BigInt! # native-BNB-quoted SparkGo swaps only — see note below
}
# totalVolumeNative/totalNativeBurnedIn/totalCallerRewardsPaid deliberately exclude anything
# quoted in a non-native currency: SparkLauncher (V1) pools can be quoted in WBNB, USDT, USDC,
# USD1 etc (see QuoteToken), and SparkGo pools are equally currency-general now (see
# QuoteTokenGo) — summing deltas from different quote currencies into one native-BNB-wei figure
# would silently mix incompatible units/decimals. These three fields are only incremented when
# the specific swap/burn's quote currency is literally native BNB (address(0) for SparkGo).
# Per-pool/per-quote-token volume is always available unconditionally on PoolV1.totalVolumeQuote
# and PoolGo.totalVolumeQuote instead.

# ─── SparkGo (BSC) ───────────────────────────────────────────────────────────
# The hook-gated Uniswap v4 / PancakeSwap Infinity launcher family — renamed from
# SparkLauncherV2 and rebuilt as an upgradeable UUPS proxy, currency-general (arbitrary quote
# tokens, not just native BNB) with a shared multi-hop fallback routing engine for instant-buy.
# The pre-rebuild SparkLauncherV2/SparkHookV4/SparkHookInfinity/SparkBurner (and their 2 real
# historical launches) were superseded and are intentionally no longer indexed — see
# Deployment.md's "Superseded / abandoned addresses" section.

"""
SparkGo — one row per deployed launcher (there is one active launcher per Deployment.md, but
the schema does not assume singularity).
"""
type LauncherGo @entity(immutable: false) {
  id: Bytes! # launcher contract address
  owner: Bytes!
  weth: Bytes! # only used to wrap native for V3/V2-style fallback routes
  tokenImpl: Bytes!
  locker: Bytes!
  launchFeeWallet: Bytes!
  burner: Bytes
  launchFee: BigInt!
  tokensLaunchedCount: BigInt!
  createdAtBlock: BigInt!
  createdAtTimestamp: BigInt!
  updatedAtBlock: BigInt!
  updatedAtTimestamp: BigInt!
  dexes: [DexGo!]! @derivedFrom(field: "launcher")
  quoteTokens: [QuoteTokenGo!]! @derivedFrom(field: "launcher")
  tokens: [TokenGo!]! @derivedFrom(field: "launcher")
}

"""
A DEX registered on SparkGo via addDex/disableDex — keyed by position manager.
"""
type DexGo @entity(immutable: false) {
  id: Bytes! # positionManager address
  launcher: LauncherGo!
  protocol: Protocol!
  singleton: Bytes! # PoolManager (v4) or Vault (Infinity)
  poolLogic: Bytes # CLPoolManager, Infinity only
  permit2: Bytes!
  hook: Bytes!
  enabled: Boolean!
  tokensLaunchedCount: BigInt!
  addedAtBlock: BigInt!
  addedAtTimestamp: BigInt!
  updatedAtBlock: BigInt!
  updatedAtTimestamp: BigInt!
  tokens: [TokenGo!]! @derivedFrom(field: "dex")
}

"""
A quote token registered on SparkGo via addQuoteToken/disableQuoteToken. id is the token
address; address(0) (native BNB) is auto-registered at initialize() and always exists.
"""
type QuoteTokenGo @entity(immutable: false) {
  id: Bytes! # quote token address, or the zero address for native BNB
  launcher: LauncherGo!
  marketCapRef: BigInt!
  enabled: Boolean!
  routeCount: BigInt! # number of configured SparkRouting fallback routes (setRoutes)
  routesUpdatedAtBlock: BigInt
  routesUpdatedAtTimestamp: BigInt
  addedAtBlock: BigInt!
  addedAtTimestamp: BigInt!
  updatedAtBlock: BigInt!
  updatedAtTimestamp: BigInt!
  tokens: [TokenGo!]! @derivedFrom(field: "quoteToken")
  routeSuccesses: [RouteSuccessGo!]! @derivedFrom(field: "quoteToken")
}

"""
One row per launched SparkToken (EIP-1167 clone of the SparkToken implementation) via SparkGo.
"""
type TokenGo @entity(immutable: false) {
  id: Bytes! # token clone address
  launcher: LauncherGo!
  dex: DexGo!
  quoteToken: QuoteTokenGo!
  name: String
  symbol: String
  decimals: Int
  totalSupply: BigInt
  metaURI: String
  creator: Bytes!
  feeWallet: Bytes!
  routedToBurner: Boolean! # true if feeWallet_ passed to launch() was address(0)
  currentOwner: Bytes # null once renounced (launch() always renounces at the end)
  renounced: Boolean!
  instantBuySkipped: Boolean! # true if an instant-buy leg failed and was skipped + refunded
  instantBuySkippedRefundWei: BigInt # set only when instantBuySkipped is true
  hook: Bytes!
  protocol: Protocol!
  poolId: Bytes!
  positionManager: Bytes!
  lockerTokenId: BigInt!
  launchBlock: BigInt!
  launchTimestamp: BigInt!
  launchTx: Bytes!
  holderCount: BigInt!
  transferCount: BigInt!
  pool: PoolGo @derivedFrom(field: "token")
  lockerPosition: LockerPositionGo @derivedFrom(field: "token")
  burns: [BurnGo!]! @derivedFrom(field: "token")
  holders: [TokenHolderGo!]! @derivedFrom(field: "token")
  swaps: [SwapGo!]! @derivedFrom(field: "token")
}

"""
SparkRouting.RouteSucceeded — one per successful leg-1 fallback route execution (native BNB ->
quoteToken) during a SparkGo launch's instant-buy. Fired inside the same executeRoute try/catch
loop that SparkRouting._acquireQuoteToken runs through the configured Route[] for a quote token
until one succeeds (or all fail, see InstantBuySkipped on TokenGo).
"""
type RouteSuccessGo @entity(immutable: true) {
  id: Bytes! # tx hash - log index
  quoteToken: QuoteTokenGo!
  routeIndex: BigInt! # index into the quote token's configured Route[] (setRoutes) that succeeded
  amountOut: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

"""
A hook-side pool registration (SparkGoHookV4.PoolRegistered / SparkGoHookInfinity.PoolRegistered),
enriched with running buy/sell activity captured from the hook's own afterSwap call (see SwapGo
below for why a call handler is used instead of an event). Every token launched through SparkGo
gets exactly one PoolGo row, created in the same transaction as the launch. id is the on-chain
poolId (bytes32), which is already unique per hook+token pair.

Unlike the pre-rebuild SparkLauncherV2 (which always paired the token against native BNB as
currency0), SparkGo is currency-general — currency0 is whichever of (quoteToken, token) sorts
lower — so quoteToken/tokenIsCurrency0 (read via eth_call from the hook's own `pools()` getter
at registration time) are needed to correctly derive buy/sell side and volume; see SwapGo.
"""
type PoolGo @entity(immutable: false) {
  id: Bytes! # poolId
  token: TokenGo!
  quoteToken: QuoteTokenGo!
  tokenIsCurrency0: Boolean!
  hook: Bytes!
  protocol: Protocol!
  creator: Bytes! # may change via CTO approval
  registeredAtBlock: BigInt!
  registeredAtTimestamp: BigInt!
  registeredAtTx: Bytes!
  totalFeesClaimed: BigInt! # in quoteToken units — see QuoteTokenGo
  claimCount: BigInt!
  pendingCTOApplicationId: String
  # Running swap (buy/sell) activity, updated from the hook's afterSwap call.
  swapCount: BigInt!
  buyCount: BigInt!
  sellCount: BigInt!
  totalVolumeQuote: BigInt! # sum of abs(quote-currency delta) across all swaps — NOT necessarily BNB, see quoteToken
  totalVolumeToken: BigInt! # sum of abs(token delta) across all swaps
  totalHookFeeTaken: BigInt! # sum of the hook's 2% sell fee across all swaps, in quoteToken units
  lastSwapBlock: BigInt
  lastSwapTimestamp: BigInt
  feeClaims: [HookFeeClaimGo!]! @derivedFrom(field: "pool")
  swaps: [SwapGo!]! @derivedFrom(field: "pool")
}

"""
SparkLocker.registerPosition (SparkGo's instance) — the permanent LP-NFT record for a launched token.
"""
type LockerPositionGo @entity(immutable: false) {
  id: Bytes! # token address
  token: TokenGo!
  tokenId: BigInt!
  feeWallet: Bytes! # may change via CTO approval
  currency0: Bytes!
  currency1: Bytes!
  singleton: Bytes!
  positionManager: Bytes!
  registeredAtBlock: BigInt!
  registeredAtTimestamp: BigInt!
  registeredAtTx: Bytes!
  totalCreator0: BigInt!
  totalCreator1: BigInt!
  totalPlatform0: BigInt!
  totalPlatform1: BigInt!
  claimCount: BigInt!
  pendingCTOApplicationId: String
  feeClaims: [LockerFeeClaimGo!]! @derivedFrom(field: "position")
}

"""
SparkLocker.claimFees (SparkGo's instance) — one per FeesClaimed event.
"""
type LockerFeeClaimGo @entity(immutable: true) {
  id: Bytes! # tx hash - log index
  position: LockerPositionGo!
  feeWallet: Bytes!
  creator0: BigInt!
  creator1: BigInt!
  platform0: BigInt!
  platform1: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

"""
SparkGoHookV4/SparkGoHookInfinity.claimFees — one per FeesClaimed event.
"""
type HookFeeClaimGo @entity(immutable: true) {
  id: Bytes! # tx hash - log index
  pool: PoolGo!
  amount: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

"""
Community takeover application, tracked across both SparkLocker instances and both SparkGo
hooks. Each applyForCTO overwrites any prior pending application for the same key on-chain, so
status transitions (PENDING -> APPROVED/REJECTED) are resolved via
PoolGo.pendingCTOApplicationId / LockerPositionGo.pendingCTOApplicationId /
LockerPositionV1.pendingCTOApplicationId.
"""
type CTOApplication @entity(immutable: false) {
  id: ID! # source-txHash-logIndex
  source: CTOSource!
  tokenGo: TokenGo # set when source is LOCKER_GO/HOOK_V4_GO/HOOK_INFINITY_GO
  poolGo: PoolGo # set when source is HOOK_V4_GO/HOOK_INFINITY_GO
  positionGo: LockerPositionGo # set when source is LOCKER_GO
  tokenV1: TokenV1 # set when source is LOCKER_V1
  positionV1: LockerPositionV1 # set when source is LOCKER_V1
  applicant: Bytes!
  newRecipient: Bytes! # newFeeWallet (locker) or newCreator (hooks)
  paid: BigInt!
  status: CTOStatus!
  appliedAtBlock: BigInt!
  appliedAtTimestamp: BigInt!
  appliedAtTx: Bytes!
  resolvedAtBlock: BigInt
  resolvedAtTimestamp: BigInt
  resolvedAtTx: Bytes
}

"""
SparkGoBurner.burnV4 / burnInfinity — claims a token's accrued hook fees (in whatever currency
the pool uses), swaps 95% into the token and sends it to 0x...dEaD, pays the caller the other 5%.
"""
type BurnGo @entity(immutable: true) {
  id: Bytes! # tx hash - log index
  token: TokenGo!
  quoteCurrency: Bytes! # currency the burned fees were denominated in (address(0) = native BNB)
  caller: Bytes!
  quoteIn: BigInt!
  callerReward: BigInt!
  tokenBurned: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

"""
Current balance of one holder of one SparkGo-launched token, maintained from Transfer events.
"""
type TokenHolderGo @entity(immutable: false) {
  id: Bytes! # token address - holder address
  token: TokenGo!
  holder: Bytes!
  balance: BigInt!
}

"""
Raw ERC-20 Transfer log for a SparkGo-launched token.
"""
type TokenTransferGo @entity(immutable: true) {
  id: Bytes! # tx hash - log index
  token: TokenGo!
  from: Bytes!
  to: Bytes!
  value: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

"""
A single swap (buy or sell) against a SparkGo-launched token's pool. Neither SparkGoHookV4 nor
SparkGoHookInfinity emits a per-swap event, but the pool's hook address is part of the pool's
identity (baked into its poolId) — Uniswap v4 / PancakeSwap Infinity invoke the hook's afterSwap
on every single swap against that pool, with no way to bypass it. So SwapGo rows are captured via
an afterSwap call handler (see subgraph.yaml) rather than a log event: the `delta` argument
passed into afterSwap is the same BalanceDelta the DEX singleton itself would have put in a Swap
event, packed as (int128 amount0 << 128) | uint128(amount1) — see
https://github.com/Uniswap/v4-core/blob/main/src/types/BalanceDelta.sol.

Unlike the pre-rebuild SparkLauncherV2, SparkGo pools do NOT always pair the token against
native BNB as currency0 — currency0 is whichever of (quoteToken, token) sorts lower (see
PoolGo). So side/volume are derived from PoolGo.tokenIsCurrency0, not a hardcoded amount0.
"""
type SwapGo @entity(immutable: true) {
  id: Bytes! # tx hash + pool id + per-pool swap sequence number (calls have no log index)
  pool: PoolGo!
  token: TokenGo!
  protocol: Protocol!
  side: SwapSide!
  sender: Bytes! # immediate caller of PoolManager/CLPoolManager.swap() — often a router
  origin: Bytes! # tx.from — the wallet that actually initiated the trade
  amount0: BigInt! # signed currency0 delta on the pool
  amount1: BigInt! # signed currency1 delta on the pool
  quoteAmount: BigInt! # abs(quote-currency delta)
  tokenAmount: BigInt! # abs(token delta)
  hookFeeTaken: BigInt! # the hook's 2% sell fee on this swap, in quoteToken units (0 unless it was a sell)
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

# ─── SparkLauncher / V1 (BSC) ────────────────────────────────────────────────
# The plain Uniswap V3 / PancakeSwap V3 launcher family — no hook, so tokens are tradeable
# through either DEX's normal swap interface. Originally deployed non-upgradeable (0 real
# launches, superseded — not indexed), then rebuilt as the upgradeable UUPS proxy indexed here.
# Currency-general from the start (WBNB, USDT, USDC, USD1, etc, each with its own
# marketCapRef), unlike SparkGo above which only became currency-general in the same rebuild.
# It reuses the same SparkLocker/SparkToken contracts as SparkGo (byte-identical, per
# Deployment.md) but as a separate deployed instance, so — like OneCoinLocker below — it gets
# its own parallel set of entities rather than reusing the SparkGo entities above, which carry
# SparkGo-specific (hook/protocol/poolId) fields that don't apply here. CTOApplication is
# shared (see tokenV1/positionV1 fields above) since it was already built to be
# source-polymorphic across both locker instances and both hooks.

"""
SparkLauncher (V1) — one row per deployed V1 launcher.
"""
type LauncherV1 @entity(immutable: false) {
  id: Bytes! # launcher contract address
  owner: Bytes!
  weth: Bytes!
  tokenImpl: Bytes!
  locker: Bytes!
  launchFeeWallet: Bytes!
  launchFee: BigInt!
  tokensLaunchedCount: BigInt!
  createdAtBlock: BigInt!
  createdAtTimestamp: BigInt!
  updatedAtBlock: BigInt!
  updatedAtTimestamp: BigInt!
  dexes: [DexV1!]! @derivedFrom(field: "launcher")
  quoteTokens: [QuoteToken!]! @derivedFrom(field: "launcher")
  tokens: [TokenV1!]! @derivedFrom(field: "launcher")
}

"""
A DEX registered on the V1 launcher via addDex/disableDex — keyed by factory address.
"""
type DexV1 @entity(immutable: false) {
  id: Bytes! # factory address
  launcher: LauncherV1!
  positionManager: Bytes!
  router: Bytes!
  routerNoDeadline: Boolean! # true for Uniswap SwapRouter02-style routers (no `deadline` field)
  enabled: Boolean!
  tokensLaunchedCount: BigInt!
  addedAtBlock: BigInt!
  addedAtTimestamp: BigInt!
  updatedAtBlock: BigInt!
  updatedAtTimestamp: BigInt!
  tokens: [TokenV1!]! @derivedFrom(field: "dex")
}

"""
A quote token registered on the V1 launcher via addQuoteToken/disableQuoteToken.
"""
type QuoteToken @entity(immutable: false) {
  id: Bytes! # quote token address
  launcher: LauncherV1!
  marketCapRef: BigInt!
  wethPairFee: Int! # deepest WETH/WBNB pool fee tier for this quote token on the DEX, 0 for weth itself
  enabled: Boolean!
  routeCount: BigInt! # number of configured SparkRouting fallback routes (setRoutes)
  routesUpdatedAtBlock: BigInt
  routesUpdatedAtTimestamp: BigInt
  addedAtBlock: BigInt!
  addedAtTimestamp: BigInt!
  updatedAtBlock: BigInt!
  updatedAtTimestamp: BigInt!
  tokens: [TokenV1!]! @derivedFrom(field: "quoteToken")
  routeSuccesses: [RouteSuccess!]! @derivedFrom(field: "quoteToken")
}

"""
SparkRouting.RouteSucceeded — one per successful leg-1 fallback route execution (native BNB ->
quoteToken) during a SparkLauncher launch's instant-buy. Fired inside the same executeRoute
try/catch loop that SparkRouting._acquireQuoteToken runs through the configured Route[] for a
quote token until one succeeds (or all fail, see InstantBuySkipped on TokenV1).
"""
type RouteSuccess @entity(immutable: true) {
  id: Bytes! # tx hash - log index
  quoteToken: QuoteToken!
  routeIndex: BigInt! # index into the quote token's configured Route[] (setRoutes) that succeeded
  amountOut: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

"""
One row per launched SparkToken (V1) — an EIP-1167 clone paired against a V3-style pool.
"""
type TokenV1 @entity(immutable: false) {
  id: Bytes! # token clone address
  launcher: LauncherV1!
  dex: DexV1!
  quoteToken: QuoteToken!
  name: String
  symbol: String
  decimals: Int
  totalSupply: BigInt
  metaURI: String
  creator: Bytes!
  feeWallet: Bytes!
  currentOwner: Bytes # null once renounced (launch() always renounces at the end)
  renounced: Boolean!
  instantBuySkipped: Boolean! # true if an instant-buy leg failed and was skipped + refunded
  instantBuySkippedRefundWei: BigInt # set only when instantBuySkipped is true
  positionManager: Bytes!
  lockerTokenId: BigInt!
  launchBlock: BigInt!
  launchTimestamp: BigInt!
  launchTx: Bytes!
  holderCount: BigInt!
  transferCount: BigInt!
  pool: PoolV1 @derivedFrom(field: "token")
  lockerPosition: LockerPositionV1 @derivedFrom(field: "token")
  holders: [TokenHolderV1!]! @derivedFrom(field: "token")
  transfers: [TokenTransferV1!]! @derivedFrom(field: "token")
}

"""
The plain Uniswap V3 / PancakeSwap V3 pool seeded by SparkLauncher.launch() for a TokenV1 —
unlike SparkGo's hook-registered PoolGo, there's no PoolRegistered event for this; it's created
inline in the same handleTokenLaunched that creates TokenV1, using the `pool` address emitted
by TokenLaunched. Since V1 has no hook, swap activity can't be captured via a call handler the
way SparkGoHookV4/SparkGoHookInfinity's afterSwap is — instead a SparkV1Pool template data
source is spawned at this exact pool address (see subgraph.yaml), listening to that one pool's
own standard Swap event. That's naturally scoped to just this pool (unlike the DEX-wide V3
Factory, which has no per-pool filtering), since a template instance only ever tracks the
single address it was created at.
"""
type PoolV1 @entity(immutable: false) {
  id: Bytes! # pool address
  token: TokenV1!
  quoteToken: QuoteToken!
  currency0: Bytes!
  currency1: Bytes!
  quoteIsToken0: Boolean! # true if quoteToken == currency0 (token address ordering varies per launch)
  fee: Int! # V3 fee tier (SparkLauncher.FEE_TIER, currently a 1% constant for every pool)
  positionManager: Bytes!
  creator: Bytes! # may change via CTO approval
  registeredAtBlock: BigInt!
  registeredAtTimestamp: BigInt!
  registeredAtTx: Bytes!
  swapCount: BigInt!
  buyCount: BigInt!
  sellCount: BigInt!
  totalVolumeQuote: BigInt! # sum of abs(quote-token delta) across all swaps — NOT necessarily BNB, see quoteToken
  totalVolumeToken: BigInt! # sum of abs(spark-token delta) across all swaps
  lastSwapBlock: BigInt
  lastSwapTimestamp: BigInt
  swaps: [SwapV1!]! @derivedFrom(field: "pool")
}

"""
A single swap (buy or sell) against a TokenV1's pool, captured directly from the pool
contract's own Swap event (see PoolV1 above for why this works cleanly for V1). side/quoteAmount
are derived from PoolV1.quoteIsToken0: the pool receiving the quote token means someone bought
the Spark token; the pool paying out the quote token means someone sold it.
"""
type SwapV1 @entity(immutable: true) {
  id: Bytes! # tx hash - log index
  pool: PoolV1!
  token: TokenV1!
  quoteToken: QuoteToken!
  side: SwapSide!
  sender: Bytes! # immediate caller of the pool's swap() — often a router
  recipient: Bytes! # where the pool sent the output token
  origin: Bytes! # tx.from — the wallet that actually initiated the trade
  amount0: BigInt! # signed delta on currency0
  amount1: BigInt! # signed delta on currency1
  quoteAmount: BigInt! # abs(quote-token delta)
  tokenAmount: BigInt! # abs(spark-token delta)
  sqrtPriceX96: BigInt!
  tick: Int!
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

"""
SparkLocker.registerPosition (V1 instance) — the permanent LP-NFT record for a V1-launched token.
"""
type LockerPositionV1 @entity(immutable: false) {
  id: Bytes! # token address
  token: TokenV1!
  tokenId: BigInt!
  feeWallet: Bytes! # may change via CTO approval
  currency0: Bytes!
  currency1: Bytes!
  singleton: Bytes!
  positionManager: Bytes!
  registeredAtBlock: BigInt!
  registeredAtTimestamp: BigInt!
  registeredAtTx: Bytes!
  totalCreator0: BigInt!
  totalCreator1: BigInt!
  totalPlatform0: BigInt!
  totalPlatform1: BigInt!
  claimCount: BigInt!
  pendingCTOApplicationId: String
  feeClaims: [LockerFeeClaimV1!]! @derivedFrom(field: "position")
}

"""
SparkLocker.claimFees (V1 instance) — one per FeesClaimed event.
"""
type LockerFeeClaimV1 @entity(immutable: true) {
  id: Bytes! # tx hash - log index
  position: LockerPositionV1!
  feeWallet: Bytes!
  creator0: BigInt!
  creator1: BigInt!
  platform0: BigInt!
  platform1: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

"""
Current balance of one holder of one V1-launched token, maintained from Transfer events.
"""
type TokenHolderV1 @entity(immutable: false) {
  id: Bytes! # token address - holder address
  token: TokenV1!
  holder: Bytes!
  balance: BigInt!
}

"""
Raw ERC-20 Transfer log for a V1-launched token.
"""
type TokenTransferV1 @entity(immutable: true) {
  id: Bytes! # tx hash - log index
  token: TokenV1!
  from: Bytes!
  to: Bytes!
  value: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

# ─── MerkleDistributor ───────────────────────────────────────────────────────
# Independent, protocol-agnostic claim-based distributor (distributor/MerkleDistributor.sol) —
# no relation to any Spark launcher, same "unrelated standalone data source" treatment as
# OneCoinLocker below. Deployed on both BSC and Ethereum (different addresses, same contract).
# One contract, many campaigns: any caller opens a campaign per token (or native currency)
# with a Merkle root committing to every (index, account, amount) allocation and funds it in
# the same transaction; each recipient (or anyone claiming on their behalf — funds always go
# to the committed `account`, never to the caller) submits a proof to claim. A campaign's own
# `creator` can sweep its unclaimed remainder after its deadline.

"""
MerkleDistributor — one row per deployed distributor contract (a singleton per chain in
practice, but the schema does not assume that).
"""
type MerkleDistributor @entity(immutable: false) {
  id: Bytes! # contract address
  owner: Bytes!
  feeWallet: Bytes!
  campaignFee: BigInt! # flat native fee charged on every createCampaign, regardless of token
  campaignCount: BigInt!
  createdAtBlock: BigInt!
  createdAtTimestamp: BigInt!
  updatedAtBlock: BigInt!
  updatedAtTimestamp: BigInt!
  campaigns: [Campaign!]! @derivedFrom(field: "distributor")
}

"""
MerkleDistributor.createCampaign — one row per campaign. id is the distributor address plus
the on-chain campaignId (which is only unique per distributor instance, not globally).
"""
type Campaign @entity(immutable: false) {
  id: Bytes! # distributor address + campaignId
  distributor: MerkleDistributor!
  campaignId: BigInt!
  creator: Bytes!
  token: Bytes! # address(0) = native currency
  merkleRoot: Bytes!
  totalAmount: BigInt! # originally funded amount, from CampaignCreated
  remaining: BigInt! # decremented on each Claimed, zeroed on Swept
  deadline: BigInt!
  swept: Boolean!
  sweptTo: Bytes
  sweptAmount: BigInt
  createdAtBlock: BigInt!
  createdAtTimestamp: BigInt!
  createdAtTx: Bytes!
  claimCount: BigInt!
  claims: [Claim!]! @derivedFrom(field: "campaign")
}

"""
MerkleDistributor.claim — one row per successful claim.
"""
type Claim @entity(immutable: true) {
  id: Bytes! # tx hash - log index
  campaign: Campaign!
  claimIndex: BigInt! # the Merkle leaf's own index, not a claim sequence number
  account: Bytes! # the committed recipient — always where funds go, regardless of caller
  caller: Bytes! # tx.from — may differ from account, since anyone can claim on someone's behalf
  amount: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

# ─── OneCoinLocker (BSC) ─────────────────────────────────────────────────────
# A general-purpose token/LP locker on BSC, unrelated to 1MEME Spark itself —
# ported from timedbase/OneMEMELaunchpad-Subgraph
# (https://github.com/timedbase/OneMEMELaunchpad-Subgraph), which uses the
# same contract for arbitrary token/LP locks outside the Spark launch flow.
# Included here at the user's request as a standalone data source alongside
# the Spark entities above — it does not reference or derive from any Token/
# Pool/Launcher entity elsewhere in this schema.

"""
Singleton per deployed OneCoinLocker contract. id is the contract address.
"""
type Locker @entity(immutable: false) {
  id: Bytes! # contract address
  totalLocks: BigInt! # all-time number of locks ever created
  activeLocks: BigInt! # locks not yet fully withdrawn or renounced
  fee: BigInt! # current static fallback fee (wei), updated via FeeUpdated
  totalFeesCollected: BigInt! # cumulative native fees swept by the owner via collectFees()
  locks: [Lock!]! @derivedFrom(field: "locker")
}

"""
An individual token lock on OneCoinLocker.
"""
type Lock @entity(immutable: false) {
  id: Bytes! # locker address + lockId
  locker: Locker!
  lockId: BigInt!
  owner: Bytes # address(0) / null when renounced
  token: Bytes!
  amount: BigInt! # actual tokens received after any transfer fee
  withdrawn: BigInt!
  lockDate: BigInt!
  startTime: BigInt! # 0 for Cliff locks; vesting start for Linear locks
  endTime: BigInt!
  lockType: String! # "Cliff" | "Linear"
  isLP: Boolean!
  description: String!
  renounced: Boolean!
  createdAtTimestamp: BigInt!
  createdAtBlockNumber: BigInt!
  txHash: Bytes!
  withdrawals: [LockWithdrawal!]! @derivedFrom(field: "lock")
  transfers: [LockTransfer!]! @derivedFrom(field: "lock")
  activity: [LockActivity!]! @derivedFrom(field: "lock")
}

"""
One per Withdrawn event.
"""
type LockWithdrawal @entity(immutable: true) {
  id: Bytes! # tx hash - log index
  lock: Lock!
  owner: Bytes!
  amount: BigInt!
  nativeFee: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  txHash: Bytes!
}

"""
A lock ownership transfer.
"""
type LockTransfer @entity(immutable: true) {
  id: Bytes! # tx hash - log index
  lock: Lock!
  from: Bytes!
  to: Bytes!
  timestamp: BigInt!
  blockNumber: BigInt!
  txHash: Bytes!
}

"""
Unified activity log for a Lock — one entry per event regardless of type.
Enables a single query to reconstruct the full lifecycle of any lock.
"""
type LockActivity @entity(immutable: true) {
  id: Bytes! # tx hash - log index
  lock: Lock!
  action: String! # CREATED | EDITED | EXTENDED | DESCRIPTION_CHANGED | WITHDRAWN | TRANSFERRED | RENOUNCED
  timestamp: BigInt!
  blockNumber: BigInt!
  txHash: Bytes!
  newAmount: BigInt # EDITED: new total amount after edit
  newEndTime: BigInt # EDITED | EXTENDED: new unlock timestamp
  description: String # DESCRIPTION_CHANGED: updated description text
  withdrawnAmount: BigInt # WITHDRAWN: tokens removed in this withdrawal
  nativeFee: BigInt # WITHDRAWN: native fee paid
  from: Bytes # TRANSFERRED: previous owner
  to: Bytes # TRANSFERRED: new owner
}
