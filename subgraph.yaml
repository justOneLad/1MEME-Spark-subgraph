specVersion: 1.0.0
description: >-
  Subgraph for 1MEME Spark on BSC mainnet, covering both active launcher
  families per Deployment.md: SparkLauncher (V1) — a currency-general,
  upgradeable Uniswap V3 / PancakeSwap V3 launcher, plus its SparkLocker
  instance — and SparkGo — a currency-general, upgradeable Uniswap v4 /
  PancakeSwap Infinity hook-gated launcher (renamed from SparkLauncherV2),
  plus its own SparkLocker instance, SparkGoHookV4, SparkGoHookInfinity and
  SparkGoBurner. Also dynamically templated SparkToken clones created by
  each launch on either family. The pre-rebuild, non-upgradeable SparkLauncher
  (0 real launches) and the pre-rebuild SparkLauncherV2/SparkHookV4/
  SparkHookInfinity/SparkBurner (superseded, cut over per Deployment.md) are
  intentionally not indexed. See
  https://github.com/justOneLad/1MEME-Spark/blob/main/Deployment.md. Also
  includes MerkleDistributor, a protocol-agnostic claim-based distributor
  unrelated to any Spark launcher, and OneCoinLocker, a general-purpose BSC
  token/LP locker unrelated to Spark, ported from
  timedbase/OneMEMELaunchpad-Subgraph.
repository: https://github.com/justOneLad/1MEME-Spark
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: OneCoinLocker
    network: bsc
    source:
      address: "0x6C6e9740753d9F6C1E5D61C8bc0f34E37590f6C5"
      abi: OneCoinLocker
      startBlock: 100627321
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Locker
        - Lock
        - LockWithdrawal
        - LockTransfer
        - LockActivity
      abis:
        - name: OneCoinLocker
          file: ./abis/OneCoinLocker.json
      eventHandlers:
        - event: LockCreated(indexed uint256,indexed address,indexed address,uint256,uint256,uint256,uint8,bool)
          handler: handleLockCreated
        - event: LockEdited(indexed uint256,uint256,uint256)
          handler: handleLockEdited
        - event: LockDescriptionChanged(indexed uint256,string)
          handler: handleLockDescriptionChanged
        - event: Withdrawn(indexed uint256,indexed address,uint256,uint256)
          handler: handleWithdrawn
        - event: LockExtended(indexed uint256,uint256)
          handler: handleLockExtended
        - event: LockTransferred(indexed uint256,indexed address,indexed address)
          handler: handleLockTransferred
        - event: LockRenounced(indexed uint256)
          handler: handleLockRenounced
        - event: FeeUpdated(uint256)
          handler: handleFeeUpdated
        - event: FeesCollected(indexed address,uint256)
          handler: handleFeesCollected
      file: ./src/onecoin-locker.ts
  - kind: ethereum
    name: MerkleDistributor
    network: bsc
    source:
      address: "0x20ED1b487dd2A172D5ba0ED33562370142Cc338b"
      abi: MerkleDistributor
      # Deployment.md doesn't list a block for this contract, and BSC isn't covered by our
      # Etherscan API key's plan (free tier) or by public RPCs (no archive access). Estimated
      # by correlating this deploy's UTC timestamp against the Ethereum MerkleDistributor's
      # confirmed block (25700654), then padded back ~13k blocks (~11 hours) for safety.
      startBlock: 114470000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - MerkleDistributor
        - Campaign
        - Claim
      abis:
        - name: MerkleDistributor
          file: ./abis/MerkleDistributor.json
      eventHandlers:
        - event: CampaignCreated(indexed uint256,indexed address,indexed address,bytes32,uint256,uint256)
          handler: handleCampaignCreated
        - event: Claimed(indexed uint256,uint256,indexed address,uint256)
          handler: handleClaimed
        - event: Swept(indexed uint256,indexed address,uint256)
          handler: handleSwept
        - event: FeeWalletSet(indexed address)
          handler: handleFeeWalletSet
        - event: CampaignFeeSet(uint256)
          handler: handleCampaignFeeSet
      file: ./src/merkle-distributor.ts
  - kind: ethereum
    name: SparkLauncherV1
    network: bsc
    source:
      address: "0xC10b8647B7d0d88B77C0A9FfAD5C7C17564B1973"
      abi: SparkLauncher
      startBlock: 113582648
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - LauncherV1
        - DexV1
        - QuoteToken
        - TokenV1
        - PoolV1
        - RouteSuccess
      abis:
        - name: SparkLauncher
          file: ./abis/SparkLauncher.json
        - name: SparkToken
          file: ./abis/SparkToken.json
        - name: UniswapV3Pool
          file: ./abis/UniswapV3Pool.json
      eventHandlers:
        - event: TokenLaunched(indexed address,indexed address,indexed address,address,address,address,uint256)
          handler: handleTokenLaunched
        - event: DexAdded(indexed address,address,address,bool)
          handler: handleDexAdded
        - event: DexDisabled(indexed address)
          handler: handleDexDisabled
        - event: QuoteTokenAdded(indexed address,uint256,uint24)
          handler: handleQuoteTokenAdded
        - event: QuoteTokenDisabled(indexed address)
          handler: handleQuoteTokenDisabled
        - event: LaunchFeeWalletSet(indexed address)
          handler: handleLaunchFeeWalletSet
        - event: LaunchFeeSet(uint256)
          handler: handleLaunchFeeSet
        - event: MarketCapRefSet(indexed address,uint256)
          handler: handleMarketCapRefSet
        - event: InstantBuySkipped(indexed address,uint256)
          handler: handleInstantBuySkipped
        - event: RoutesSet(indexed address,uint256)
          handler: handleRoutesSet
        - event: RouteSucceeded(indexed address,indexed uint256,uint256)
          handler: handleRouteSucceeded
      file: ./src/launcher-v1.ts
  - kind: ethereum
    name: SparkLockerV1
    network: bsc
    source:
      address: "0xA69B4B4003483E7Ca27DDf1bE8cBC7e723afcF86"
      abi: SparkLocker
      startBlock: 113379804
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - LockerPositionV1
        - LockerFeeClaimV1
        - CTOApplication
      abis:
        - name: SparkLocker
          file: ./abis/SparkLocker.json
      eventHandlers:
        - event: PositionRegistered(indexed address,indexed uint256,address,address,address)
          handler: handlePositionRegistered
        - event: FeesClaimed(indexed address,indexed address,uint256,uint256,uint256,uint256)
          handler: handleFeesClaimed
        - event: CTOApplied(indexed address,indexed address,address,uint256)
          handler: handleCTOApplied
        - event: CTOApproved(indexed address,address)
          handler: handleCTOApproved
        - event: CTORejected(indexed address,indexed address)
          handler: handleCTORejected
      file: ./src/locker-v1.ts
  - kind: ethereum
    name: SparkGoLauncher
    network: bsc
    source:
      address: "0xC0d33846D04F5Ce0a34AEecE9b6462433EBC8f7C"
      abi: SparkGoLauncher
      startBlock: 113583462
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - LauncherGo
        - DexGo
        - QuoteTokenGo
        - TokenGo
        - RouteSuccessGo
      abis:
        - name: SparkGoLauncher
          file: ./abis/SparkGoLauncher.json
        - name: SparkToken
          file: ./abis/SparkToken.json
      eventHandlers:
        - event: TokenLaunched(indexed address,indexed address,indexed address,address,address,address,bytes32,uint256)
          handler: handleTokenLaunched
        - event: DexAdded(indexed address,uint8,address,address,address,address)
          handler: handleDexAdded
        - event: DexDisabled(indexed address)
          handler: handleDexDisabled
        - event: QuoteTokenAdded(indexed address,uint256)
          handler: handleQuoteTokenAdded
        - event: QuoteTokenDisabled(indexed address)
          handler: handleQuoteTokenDisabled
        - event: LaunchFeeWalletSet(indexed address)
          handler: handleLaunchFeeWalletSet
        - event: BurnerSet(indexed address)
          handler: handleBurnerSet
        - event: LaunchFeeSet(uint256)
          handler: handleLaunchFeeSet
        - event: MarketCapRefSet(indexed address,uint256)
          handler: handleMarketCapRefSet
        - event: InstantBuySkipped(indexed address,uint256)
          handler: handleInstantBuySkipped
        - event: RoutesSet(indexed address,uint256)
          handler: handleRoutesSet
        - event: RouteSucceeded(indexed address,indexed uint256,uint256)
          handler: handleRouteSucceeded
      file: ./src/launcher-go.ts
  - kind: ethereum
    name: SparkLockerGo
    network: bsc
    source:
      address: "0x01245e814bbc3A1DC3b24924FB0E4E3b6863105B"
      abi: SparkLocker
      # SparkLocker.setLauncher(SparkGoLauncher proxy) — this locker instance predates SparkGo
      # (it was originally paired with the now-superseded SparkLauncherV2) but is reused, per
      # Deployment.md. Starting at the repoint block cleanly excludes the 2 real historical
      # launches from the superseded launcher, which is intentionally not indexed above.
      startBlock: 113583466
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - LockerPositionGo
        - LockerFeeClaimGo
        - CTOApplication
      abis:
        - name: SparkLocker
          file: ./abis/SparkLocker.json
      eventHandlers:
        - event: PositionRegistered(indexed address,indexed uint256,address,address,address)
          handler: handlePositionRegistered
        - event: FeesClaimed(indexed address,indexed address,uint256,uint256,uint256,uint256)
          handler: handleFeesClaimed
        - event: CTOApplied(indexed address,indexed address,address,uint256)
          handler: handleCTOApplied
        - event: CTOApproved(indexed address,address)
          handler: handleCTOApproved
        - event: CTORejected(indexed address,indexed address)
          handler: handleCTORejected
      file: ./src/locker-go.ts
  - kind: ethereum
    name: SparkGoHookV4
    network: bsc
    source:
      address: "0xdF3f8b41a55fb8737D653d6bc7467095e48700c4"
      abi: SparkGoHookV4
      startBlock: 113583474
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - PoolGo
        - HookFeeClaimGo
        - CTOApplication
        - SparkStats
        - SwapGo
      abis:
        - name: SparkGoHookV4
          file: ./abis/SparkGoHookV4.json
      eventHandlers:
        - event: PoolRegistered(indexed bytes32,indexed address,indexed address)
          handler: handlePoolRegistered
        - event: FeesClaimed(indexed bytes32,uint256)
          handler: handleFeesClaimed
        - event: CTOApplied(indexed bytes32,indexed address,address,uint256)
          handler: handleCTOApplied
        - event: CTOApproved(indexed bytes32,address)
          handler: handleCTOApproved
        - event: CTORejected(indexed bytes32,indexed address)
          handler: handleCTORejected
      # afterSwap is called by the Uniswap v4 PoolManager on EVERY swap against
      # a Spark pool — the hook address is baked into the pool's identity, so
      # there is no way to trade on one of these pools without going through
      # it. Neither hook emits a per-swap event, so a call handler is the only
      # way to capture buy/sell activity; it's naturally scoped to just this
      # contract (unlike the shared, chain-wide PoolManager Swap event).
      callHandlers:
        - function: afterSwap(address,(address,address,uint24,int24,address),(bool,int256,uint160),int256,bytes)
          handler: handleAfterSwap
      file: ./src/hook-v4-go.ts
  - kind: ethereum
    name: SparkGoHookInfinity
    network: bsc
    source:
      address: "0x8E273c882267f034ACE21dA677dBF0c0eB305B82"
      abi: SparkGoHookInfinity
      startBlock: 113583482
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - PoolGo
        - HookFeeClaimGo
        - CTOApplication
        - SparkStats
        - SwapGo
      abis:
        - name: SparkGoHookInfinity
          file: ./abis/SparkGoHookInfinity.json
      eventHandlers:
        - event: PoolRegistered(indexed bytes32,indexed address,indexed address)
          handler: handlePoolRegistered
        - event: FeesClaimed(indexed bytes32,uint256)
          handler: handleFeesClaimed
        - event: CTOApplied(indexed bytes32,indexed address,address,uint256)
          handler: handleCTOApplied
        - event: CTOApproved(indexed bytes32,address)
          handler: handleCTOApproved
        - event: CTORejected(indexed bytes32,indexed address)
          handler: handleCTORejected
      # Same rationale as SparkGoHookV4 above: afterSwap is invoked by the
      # PancakeSwap Infinity CLPoolManager on every swap against a Spark pool.
      callHandlers:
        - function: afterSwap(address,(address,address,address,address,uint24,bytes32),(bool,int256,uint160),int256,bytes)
          handler: handleAfterSwap
      file: ./src/hook-infinity-go.ts
  - kind: ethereum
    name: SparkGoBurner
    network: bsc
    source:
      address: "0xC99fD815f5C0a5dCf2B6cA36A38AbbB5cF4e4c10"
      abi: SparkGoBurner
      startBlock: 113583491
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - BurnGo
        - SparkStats
      abis:
        - name: SparkGoBurner
          file: ./abis/SparkGoBurner.json
      eventHandlers:
        - event: Burned(indexed address,indexed address,indexed address,uint256,uint256,uint256)
          handler: handleBurned
      file: ./src/burner-go.ts
templates:
  - kind: ethereum
    name: SparkTokenV1
    network: bsc
    source:
      abi: SparkToken
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - TokenV1
        - TokenHolderV1
        - TokenTransferV1
      abis:
        - name: SparkToken
          file: ./abis/SparkToken.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
        - event: MetaURISet(string)
          handler: handleMetaURISet
      file: ./src/token-v1.ts
  - kind: ethereum
    name: SparkV1Pool
    network: bsc
    source:
      abi: UniswapV3Pool
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - PoolV1
        - SwapV1
      abis:
        - name: UniswapV3Pool
          file: ./abis/UniswapV3Pool.json
      eventHandlers:
        - event: Swap(indexed address,indexed address,int256,int256,uint160,uint128,int24)
          handler: handleSwap
      file: ./src/pool-v1.ts
  - kind: ethereum
    name: SparkTokenGo
    network: bsc
    source:
      abi: SparkToken
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - TokenGo
        - TokenHolderGo
        - TokenTransferGo
      abis:
        - name: SparkToken
          file: ./abis/SparkToken.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
        - event: MetaURISet(string)
          handler: handleMetaURISet
      file: ./src/token-go.ts
